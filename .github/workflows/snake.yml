name: Generate Contribution Snake

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: velmurugansurendhar123-dotcom
          outputs: |
            github-snake.svg?color_snake=FF6EC7&color_dots=#171321,#C77DFF,#B76BDB,#FF6EC7,#F8F7FF

      - name: Commit Snake
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update contribution snake"
          default_author: github_actions
